# Redirect http -> https
server {
    listen 80;
    server_name matdaaniq.com www.matdaaniq.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.matdaaniq.com$request_uri;
    }
}

# Redirect https://matdaaniq.com -> https://www.matdaaniq.com
server {
    listen 443 ssl;
    server_name matdaaniq.com;

    ssl_certificate /etc/letsencrypt/live/matdaaniq.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/matdaaniq.com/privkey.pem;

    return 301 https://www.matdaaniq.com$request_uri;
}

# Main site: https://www.matdaaniq.com
server {
    listen 443 ssl;
    server_name www.matdaaniq.com;

    ssl_certificate /etc/letsencrypt/live/matdaaniq.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/matdaaniq.com/privkey.pem;

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
